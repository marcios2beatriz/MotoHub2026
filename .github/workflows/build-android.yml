name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'src/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build web assets
      run: npm run build
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
    
    - name: Build Android Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: MotoHub Delivery v1.0.${{ github.run_number }}
        body: |
          ## 🚀 MotoHub Delivery - Build Automático
          
          ### ✅ Correções nesta versão:
          - Fix: GPS background agora salva direto no Supabase via Android nativo
          - Fix: Corrigido crash do canal de notificação (SecurityException)
          - Fix: GPS Watchdog auto-recovery funcionando
          - Perf: Reduzido intervalo de polling na web de 30s para 60s
          
          ### 📱 Como instalar:
          1. Baixe o arquivo `app-debug.apk` abaixo
          2. Envie para o celular via WhatsApp/Telegram
          3. Abra o arquivo no celular
          4. Habilite "Instalar de fontes desconhecidas" se pedido
          5. Confirme a instalação
          
          ### 🎯 Testado:
          - ✅ GPS funciona com tela apagada
          - ✅ GPS funciona com app minimizado
          - ✅ GPS funciona enquanto usa Waze/Google Maps
          - ✅ Salvamento direto no Supabase sem depender de JavaScript
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
